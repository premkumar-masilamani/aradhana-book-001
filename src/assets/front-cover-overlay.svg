<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1055 1491" width="1055" height="1491">
  <defs>
    <style>
      .title-main {
        font-family: 'Playfair Display', 'Georgia', 'Times New Roman', serif;
        font-size: 88px;
        font-weight: 800;
        fill: #152238;
        text-anchor: middle;
      }
      .title-sub {
        font-family: 'Playfair Display', 'Georgia', 'Times New Roman', serif;
        font-size: 58px;
        font-weight: 700;
        fill: #152238;
        text-anchor: middle;
      }
      .title-murder {
        font-family: 'Cinzel Decorative', 'Georgia', serif;
        font-size: 118px;
        font-weight: 900;
        fill: #990000;
        text-anchor: middle;
        filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.5));
      }
      .author {
        font-family: 'Playfair Display', 'Georgia', 'Times New Roman', serif;
        font-size: 46px;
        font-weight: 700;
        fill: #ffffff;
        text-anchor: middle;
        letter-spacing: 2px;
        filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.85));
      }
    </style>
  </defs>

  <!-- Front Cover Text Overlay -->
  <g id="front-text">
    <text x="527" y="220" class="title-main">What</text>
    <text x="527" y="315" class="title-main">Not To Do,</text>
    <text x="527" y="390" class="title-sub">When There Is a</text>
    <text x="527" y="515" class="title-murder">Murder</text>
    <text x="527" y="605" class="title-main" style="font-size: 72px;">In Town...</text>

    <!-- Author Name at bottom -->
    <text x="527" y="1395" class="author">Aradhana Premkumar</text>
  </g>
</svg>
