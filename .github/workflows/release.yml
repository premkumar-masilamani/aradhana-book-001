name: Build and Release Book Artifacts

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (leave blank for auto v1.0.<run_number>)'
        required: false
        default: ''
      book_name:
        description: 'Book identifier variable (defaults to Aradhana_Mystery_Novel_001)'
        required: false
        default: 'Aradhana_Mystery_Novel_001'

permissions:
  contents: write

env:
  BOOK_NAME: Aradhana_Mystery_Novel_001

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Book Name Variable
        run: |
          if [ -n "${{ github.event.inputs.book_name }}" ]; then
            echo "BOOK_NAME=${{ github.event.inputs.book_name }}" >> "$GITHUB_ENV"
          elif [ -z "$BOOK_NAME" ]; then
            echo "BOOK_NAME=$(make -s name)" >> "$GITHUB_ENV"
          fi

      - name: Setup Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: '3.6'

      - name: Setup Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: 'latest'

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-dejavu-core

      - name: Build all book formats
        run: make all BOOK_NAME="$BOOK_NAME"

      - name: Verify build outputs
        run: |
          ls -lh output/
          test -f "output/${BOOK_NAME}.epub"
          test -f "output/${BOOK_NAME}.pdf"
          test -f "output/${BOOK_NAME}_Booklet.pdf"

      - name: Upload build artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: book-artifacts
          path: output/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          else
            TAG_NAME="v1.0.${{ github.run_number }}"
          fi

          echo "Publishing GitHub Release for tag: $TAG_NAME with book name: $BOOK_NAME"

          printf "Automated release of **What Not To Do When There Is A Murder In Town** by Aradhana Premkumar.\n\n### Direct Downloads\n- [%s.epub](https://github.com/%s/releases/latest/download/%s.epub) *(Reflowable EPUB 3 ebook)*\n- [%s.pdf](https://github.com/%s/releases/latest/download/%s.pdf) *(Printable A4 book PDF)*\n- [%s_Booklet.pdf](https://github.com/%s/releases/latest/download/%s_Booklet.pdf) *(Booklet duplex print PDF)*\n" \
            "$BOOK_NAME" "${{ github.repository }}" "$BOOK_NAME" \
            "$BOOK_NAME" "${{ github.repository }}" "$BOOK_NAME" \
            "$BOOK_NAME" "${{ github.repository }}" "$BOOK_NAME" > release_notes.md

          gh release create "$TAG_NAME" \
            "output/${BOOK_NAME}.epub" \
            "output/${BOOK_NAME}.pdf" \
            "output/${BOOK_NAME}_Booklet.pdf" \
            --target "${{ github.sha }}" \
            --title "Release $TAG_NAME" \
            --notes-file release_notes.md \
            --latest
