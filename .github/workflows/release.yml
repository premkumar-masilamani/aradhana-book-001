name: Build and Release Book Artifacts

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (leave blank for auto v1.0.<run_number>)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: '3.6'

      - name: Setup Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: 'latest'

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-dejavu-core

      - name: Build all book formats
        run: make all

      - name: Verify build outputs
        run: |
          ls -lh output/
          test -f output/Aradhana_Mystery_Novel_001.epub
          test -f output/Aradhana_Mystery_Novel_001.pdf
          test -f output/Aradhana_Mystery_Novel_001_Booklet.pdf

      - name: Upload build artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: book-artifacts
          path: output/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          else
            TAG_NAME="v1.0.${{ github.run_number }}"
          fi

          echo "Publishing GitHub Release for tag: $TAG_NAME"

          gh release create "$TAG_NAME" \
            output/Aradhana_Mystery_Novel_001.epub \
            output/Aradhana_Mystery_Novel_001.pdf \
            output/Aradhana_Mystery_Novel_001_Booklet.pdf \
            --target "${{ github.sha }}" \
            --title "Release $TAG_NAME" \
            --notes "Automated release of **What Not To Do When There Is A Murder In Town** by Aradhana Premkumar.

### Direct Downloads
- [Aradhana_Mystery_Novel_001.epub](https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/Aradhana_Mystery_Novel_001.epub) *(Reflowable EPUB 3 ebook)*
- [Aradhana_Mystery_Novel_001.pdf](https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/Aradhana_Mystery_Novel_001.pdf) *(Printable A4 book PDF)*
- [Aradhana_Mystery_Novel_001_Booklet.pdf](https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/Aradhana_Mystery_Novel_001_Booklet.pdf) *(Booklet duplex print PDF)*" \
            --latest
